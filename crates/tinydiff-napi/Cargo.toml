[package]
name = "tinydiff-napi"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
tinydiff-core = { path = "../tinydiff-core" }
napi = { version = "3.12.4", default-features = false, features = ["napi9", "async", "serde-json"] }
napi-derive = "3.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2.4.2"
