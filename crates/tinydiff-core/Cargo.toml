[package]
name = "tinydiff-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[lints]
workspace = true

[features]
default = []
specta = ["dep:specta"]
vendored = ["git2/vendored-libgit2", "git2/vendored-openssl"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = "0.20"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
fs2 = "0.4"
specta = { version = "=2.0.0-rc.22", features = ["derive"], optional = true }

[dev-dependencies]
specta-typescript = "0.0.9"
tempfile = "3.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "export-types"
required-features = ["specta"]
