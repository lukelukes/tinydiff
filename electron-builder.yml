appId: com.lukelukes.tinydiff
productName: TinyDiff
executableName: tinydiff
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - out/main/chunks/*.node
extraFiles:
  - from: build/AppRun
    to: AppRun
extraResources: []
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
  maintainer: Luke Lukes <126602706+lukelukes@users.noreply.github.com>
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  executableArgs: []
deb:
  afterInstall: build/after-install.tpl
  depends:
    - libc6 (>= 2.38)
    - libasound2t64 | libasound2
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libatk1.0-0t64 | libatk1.0-0
    - libatspi2.0-0t64 | libatspi2.0-0
    - libcairo2
    - libcups2t64 | libcups2
    - libdbus-1-3
    - libexpat1
    - libgbm1
    - libgcc-s1
    - libglib2.0-0t64 | libglib2.0-0
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libsecret-1-0
    - libudev1
    - libuuid1
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
    - libxss1
    - libxtst6
    - xdg-utils
    - zlib1g
  fpm:
    - --exclude
    - opt/TinyDiff/AppRun
