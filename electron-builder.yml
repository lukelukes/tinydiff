appId: com.lukelukes.tinydiff
productName: TinyDiff
executableName: tinydiff
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - out/main/chunks/*.node
extraFiles:
  - from: build/AppRun
    to: AppRun
extraResources: []
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
  maintainer: Luke Lukes <126602706+lukelukes@users.noreply.github.com>
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  executableArgs: []
deb:
  afterInstall: build/after-install.tpl
  depends:
    - libc6 (>= 2.38)
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  fpm:
    - --exclude
    - opt/TinyDiff/AppRun
